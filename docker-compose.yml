name: ragkb

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragkb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: ragkb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragkb_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragkb -d ragkb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the API in Docker too →  docker compose --profile full up --build
  api:
    profiles: ["full"]
    build: .
    container_name: ragkb-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=ragkb;Username=ragkb;Password=${POSTGRES_PASSWORD:-ragkb_dev_password}"
      OpenAI__ApiKey: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      Security__AllowedOrigins__0: "http://localhost:5173"   # UI is also served by the API at http://localhost:5080
      Security__ApiKey: ${API_KEY:-}
    ports:
      - "5080:8080"

volumes:
  pgdata:

# Render Blueprint: New + > Blueprint > pick this repo.
# Creates a free Postgres (pgvector is enabled by the app on startup) and one free Docker
# web service that serves both the API and the React UI on the same URL.
# Note: Render's free Postgres expires 30 days after creation — fine for a demo.
databases:
  - name: ragkb-db
    plan: free
    region: frankfurt
    databaseName: ragkb
    user: ragkb
    postgresMajorVersion: "16"

services:
  - type: web
    name: ragkb
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ragkb-db
          property: connectionString
      - key: AI__Provider
        value: Gemini   # Gemini (free tier) or OpenAI (paid, private)
      - key: AI__ApiKey
        sync: false     # Render asks for it when you create the Blueprint
